<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Sei offline</title>
<style>
  html, body { height: 100%; margin: 0; background: #080808; color: #F5F0E8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: rgba(245,240,232,0.6); margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
  button { background: linear-gradient(135deg, #E8C96B, #C9A84C 50%, #8B6820); color: #0A0A0A; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Sei offline</h1>
  <p>Controlla la connessione a internet. I tuoi dati sono al sicuro: appena torni online ritrovi tutto.</p>
  <button onclick="location.reload()">Riprova</button>
</main>
</body>
</html>
